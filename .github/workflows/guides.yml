name: Validate guides
on:
  push:
    paths: ['docs/**', '.github/workflows/guides.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/guides.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate translations and generated bundle
        run: |
          python3 docs/scripts/build.py
          git diff --exit-code -- docs/assets/content.js
          node --check docs/assets/app.js
          node --check docs/assets/content.js
